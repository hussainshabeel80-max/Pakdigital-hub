    <script>
      // Defensive shim for environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch || originalFetch;
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return customFetch || originalFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }

          window.addEventListener('error', function(e) {
            if (e && e.message && typeof e.message === 'string' && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>
